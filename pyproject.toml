[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-document-capture"
version = "0.4.2"
description = "Local, pixel-only desktop document capture"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "opencv-python-headless>=4.10,<5", "PyMuPDF>=1.24,<2", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "psutil>=6,<8"]
gui = ["PySide6>=6.8,<7", "mss>=10,<11"]

[project.scripts]
vdc-validate = "vdc.app.validate:main"

[project.gui-scripts]
vdc = "vdc.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
